<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page draw under phone notches; we pad with env(safe-area-inset-*) in CSS -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Colors the phone's browser bar. ThemeProvider updates this whenever the palette changes. -->
    <meta name="theme-color" content="#0D1C20" />
    <!--
      Paints the saved palette's background BEFORE React loads, so there is no flash of the wrong colors.
      Picks night or day the same way the app does: the saved choice, otherwise the device's light/dark setting.
      Only the canvas color is needed here (nothing else is visible yet). Each entry is [night, day].
      These values are computed from src/theme/palettes.js + variants.js. If you change a palette's colors, the dev
      console will warn when this table is out of date. ThemeProvider takes over once React mounts.
    -->
    <script>
      (function () {
        try {
          var canvas = {
            "default": ["#0D1C20", "#faecd8"],
            "christmas-at-grace": ["#7F1A1C", "#fcf1db"],
            "classic-christmas": ["#2F5D3A", "#f6eedc"],
            "snowy-woodland": ["#012714", "#F4EFE3"],
            "sugarplum": ["#6B1E3A", "#f8eed8"],
            "gingerbread": ["#9A4F1E", "#f8eed9"],
            "frosted-night": ["#1B2A4A", "#f5f5f5"]
          };
          var saved = localStorage.getItem("ss-mode");
          var day = saved === "day" ? true : saved === "night" ? false : window.matchMedia("(prefers-color-scheme: light)").matches;
          var id = localStorage.getItem("ss-palette");
          if (!canvas[id]) id = "default";
          var c = canvas[id][day ? 1 : 0];
          document.documentElement.style.setProperty("--c-canvas", c);
          document.querySelector('meta[name="theme-color"]').setAttribute("content", c);
          window.__ssBoot = { id: id, mode: day ? "day" : "night", canvas: c };
        } catch (e) {}
      })();
    </script>
    <!-- Striper (title font, self-hosted). Preloaded so the title never shows in a fallback font. -->
    <link rel="preload" href="/fonts/Striper-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>" />
    <title>Secret Santa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
